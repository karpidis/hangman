<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>
<body class="index-page">
  <div class="index-overlay">
    <div class="index-card">
      <h1 class="game-title">HANGMAN</h1>
      <form action="/start" method="POST" class="start-form">
        <div class="form-group">
          <label>Your name</label>
          <input type="text" name="username" placeholder="Enter your name" maxlength="20" required>
        </div>
        <div class="form-group">
          <label>Language</label>
          <select name="language_id" id="lang-select" required>
            {% for lang in languages %}
            <option value="{{ lang['id'] }}"
                    data-name="{{ lang['name'] }}"
                    data-code="{{ lang['code'] }}">
              {{ lang['name'] }}
            </option>
            {% endfor %}
          </select>
          <input type="hidden" name="lang_name" id="lang-name-input">
          <input type="hidden" name="lang_code" id="lang-code-input">
        </div>
        <button type="submit" class="btn-wood">Play</button>
      </form>
    </div>
  </div>
  <script>
    const sel = document.getElementById('lang-select');
    function syncLang() {
      const opt = sel.options[sel.selectedIndex];
      document.getElementById('lang-name-input').value = opt.dataset.name;
      document.getElementById('lang-code-input').value = opt.dataset.code;
    }
    sel.addEventListener('change', syncLang);
    syncLang();
  </script>
</body>
</html>
